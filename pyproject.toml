[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stressforge"
version = "1.0.0"
description = "Differential stress-tester: brute-force oracle vs optimized solution on randomized cases."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohd Abdul Nawaz" }]
keywords = ["testing", "stress-test", "competitive-programming", "differential-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
stressforge = "stressforge.cli:main"

[tool.setuptools]
packages = ["stressforge"]
